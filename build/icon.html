<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    /* The renderer's .brand-mark, scaled 38px -> 1024px (radius 10/38 ~ 269). */
    html, body { margin: 0; padding: 0; background: transparent; }
    .mark {
      width: 1024px;
      height: 1024px;
      border-radius: 269px;
      background: conic-gradient(from 210deg, #fbbc04, #34a853, #1a73e8, #d93025, #fbbc04);
    }
  </style>
</head>
<body>
  <div class="mark"></div>
</body>
</html>
